name: Publish development downloads

on:
  workflow_run:
    workflows: [Windows x64 App]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Windows master build to publish'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-development-downloads
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == '425776024/MOSS-Image-Qt' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Always run the publisher from the trusted branch, never from an artifact
      # or the triggering PR. Downloaded app binaries are not executed here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          persist-credentials: false
      - name: Verify source, checksums and publish a development Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/publish_preview.py "$BUILD_RUN_ID" --allow-manual-run
          else
            python3 scripts/publish_preview.py "$BUILD_RUN_ID"
          fi
