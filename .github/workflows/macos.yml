name: macOS App and DMG

on:
  push:
    branches: [codex/public-release, codex/macos-release-ci]
    tags: ['v*']
  pull_request:
    branches: [codex/public-release]
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Developer ID signing + Apple notarization (requires macos-release secrets)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build complete Apple Silicon app
    runs-on: macos-15
    timeout-minutes: 120
    env:
      BUILD_JOBS: '3'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check architecture and public-source boundary
        run: |
          test "$(uname -m)" = arm64
          python3 scripts/public_release.py audit
          python3 -m unittest discover -s tests -p '*_tests.py'
      - name: Install build tools and Qt 6.10.2
        run: |
          brew install cmake ninja pkg-config openssl@3 nlohmann-json
          python3 -m pip install aqtinstall==3.3.0
          python3 -m aqt install-qt mac desktop 6.10.2 clang_64 -m qtmultimedia qtshadertools -O "$RUNNER_TEMP/Qt"
          echo "QT_ROOT=$RUNNER_TEMP/Qt/6.10.2/macos" >> "$GITHUB_ENV"
      - name: Build native workers, run CTest, deploy and package
        run: ./scripts/build_ci_macos.sh
      - name: Smoke test the deployed app without development paths
        timeout-minutes: 3
        env:
          MOSS_DISABLE_DEV_PATHS: '1'
        run: |
          export MOSS_OUTPUT_ROOT="$RUNNER_TEMP/moss-smoke/works"
          export MOSS_SETTINGS_ROOT="$RUNNER_TEMP/moss-smoke/settings"
          python3 scripts/public_release.py app 'dist/Moss Studio.app'
          'dist/Moss Studio.app/Contents/MacOS/MossStudio' --home-smoke
      - name: Upload unsigned test packages (not a notarized release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-arm64-unsigned
          path: dist/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-build-evidence
          path: |
            dist/bundle-audit.json
            build-ci/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  sign:
    name: Sign and notarize official build
    needs: build
    if: >-
      github.repository == '425776024/MOSS-Image-Qt' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.notarize))
    runs-on: macos-15
    timeout-minutes: 90
    environment: macos-release
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a reviewed commit on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo 'Signed manual builds must run on the default branch.' >&2
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macOS-arm64-unsigned
          path: incoming
      - name: Verify and unpack this run's build
        run: |
          (cd incoming && shasum -a 256 -c SHA256SUMS.txt)
          mkdir -p dist
          ditto -x -k incoming/*.app.zip dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'dist/Moss Studio.app/Contents/Info.plist')
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Sign, notarize and staple (credentials exist only in this step)
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/macos_distribution.py sign-notarize 'dist/Moss Studio.app' --output dist/signed
      - name: Smoke test after credentials have been removed
        timeout-minutes: 3
        env:
          MOSS_DISABLE_DEV_PATHS: '1'
        run: |
          export MOSS_OUTPUT_ROOT="$RUNNER_TEMP/moss-signed-smoke/works"
          export MOSS_SETTINGS_ROOT="$RUNNER_TEMP/moss-signed-smoke/settings"
          python3 scripts/public_release.py app 'dist/Moss Studio.app'
          'dist/Moss Studio.app/Contents/MacOS/MossStudio' --home-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-arm64-notarized
          path: dist/signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Create a draft GitHub Release
    needs: sign
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macOS-arm64-notarized
          path: release
      - name: Upload verified distribution to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --draft \
              --title "Moss Studio $RELEASE_TAG" --generate-notes
          fi
